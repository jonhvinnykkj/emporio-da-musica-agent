[project]
name = "emporio-agent"
version = "0.1.0"
description = "Text-message customer-service agent for Empório da Música"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "holidays",
    "pypdf",
    "python-dotenv",
    "tzdata",
]

[project.scripts]
emporio = "emporio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

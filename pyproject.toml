[project]
name = "emporio-agent"
version = "0.1.0"
description = "Text-message customer-service agent for Empório da Música"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pypdf",
    "python-dotenv",
    "tzdata",
]

[project.scripts]
emporio = "emporio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/emporio"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 110
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt and tool-description text is customer-facing prose kept on one line per sentence.
"src/emporio/prompts.py" = ["E501"]
"src/emporio/tools.py" = ["E501"]
"src/emporio/manual.py" = ["E501"]

[tool.mypy]
files = ["src"]
strict = true
